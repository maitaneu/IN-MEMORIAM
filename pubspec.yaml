name: in_memoriam
description: Red social de esquelas y fallecimientos — IN MEMORIAM
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Navegación
  go_router: ^13.2.0

  # Estado
  provider: ^6.1.2

  # UI
  cupertino_icons: ^1.0.6
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  flutter_svg: ^2.0.10+1
  google_fonts: ^6.2.1
  timeago: ^3.6.1
  smooth_page_indicator: ^1.1.0
  carousel_slider: ^4.2.1
  flutter_staggered_grid_view: ^0.7.0

  # Formularios y validación
  flutter_form_builder: ^9.3.0
  form_builder_validators: ^11.3.0

  # Utilidades
  intl: ^0.20.3
  uuid: ^4.3.3
  url_launcher: ^6.2.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
